<div id="overlay">

</div>
<!-- NÚT GÓC TRÊN BÊN PHẢI -->

        <div class="bio-container">
            <span class="bio-text">Anh iu tất cả các iêm!!!!</span>
        </div>
        
        <div class="info-text">
            <svg viewBox="0 0 24 24" style="width:16px; height:16px; fill:#fff;"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/></svg>

        <div class="info-text">
            <svg viewBox="0 0 24 24" style="width:16px; height:16px; fill:#fff;"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>

        <div class="social-links">

                <img src="https://upload.wikimedia.org/wikipedia/commons/b/b9/2023_Facebook_icon.svg" alt="Facebook">
            </a>
            <a href="https://www.instagram.com/bbaox33.2hz" target="_blank" class="social-icon">
                <img src="https://upload.wikimedia.org/wikipedia/commons/e/e7/Instagram_logo_2016.svg" alt="Instagram">
            </a>
            <a href="https://www.youtube.com/@DaLunConLao" target="_blank" class="social-icon">
                <img src="https://upload.wikimedia.org/wikipedia/commons/0/09/YouTube_full-color_icon_%282017%29.svg" alt="YouTube">
            </a>
        </div>
    </div>
</div>

<!-- NÚT ĐIỀU KHIỂN ÂM THANH / VIDEO -->
<div class="controls" id="controls">
    <button class="btn" id="playBtn">
        <svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </button>
    <div class="sound-wrapper">
        <div class="volume-box">
            <input type="range" class="volume-slider" id="vSlider" min="0" max="1" step="0.01" value="1">
        </div>
        <button class="btn" id="soundBtn">
            <svg id="soundIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
